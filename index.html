<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doodle To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Blob that follows the cursor -->
  <div id="blob"><div class="body"></div><div class="eyes"><i></i><i></i></div></div>

  <main>
    <button class="sticker" id="avatar" title="Open profile">✏️</button>
    <h1 id="title">What needs doing today?</h1>
    <p class="sub" id="sub">Add a task and tick it off when you're done.</p>

    <section class="notebook">
      <span class="tab" id="tab">my notebook</span>

      <form id="form" autocomplete="off">
        <input id="input" type="text" placeholder="send invoice to Lumen" />
        <button type="submit">add</button>
      </form>

      <nav class="filters">
        <button class="on" data-filter="all">all</button>
        <button data-filter="active">to do</button>
        <button data-filter="done">done</button>
        <input id="search" type="text" placeholder="search..." />
      </nav>
      <div class="progress"><div id="bar"></div></div>

      <ul id="list"></ul>

      <div class="foot">
        <span>press / to jump to the input</span>
        <button id="clear">clear done (0)</button>
      </div>
    </section>
  </main>

  <!-- Profile pop-up -->
  <dialog id="profile">
    <h2>my profile</h2>
    <input id="pname" type="text" maxlength="16" placeholder="your name" />
    <p>pick a face</p>
    <div class="picks" id="faces"></div>
    <p>blob colour</p>
    <div class="picks" id="colors"></div>
    <div class="stats" id="stats"></div>
    <div class="row">
      <button id="pcancel">close</button>
      <button id="psave">save</button>
    </div>
  </dialog>

  <script src="script.js"></script>
  <script src="profile.js"></script>
  <script src="blob.js"></script>
</body>
</html>
