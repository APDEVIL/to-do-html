<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doodle To-Do</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Blob that follows the cursor -->
  <div id="blob"><div class="body"></div><div class="eyes"><i></i><i></i></div></div>

  <main>
    <div class="sticker">✏️</div>
    <h1>What needs doing today?</h1>
    <p class="sub">Add a task and tick it off when you're done.</p>

    <section class="notebook">
      <span class="tab">my notebook</span>

      <form id="form" autocomplete="off">
        <input id="input" type="text" placeholder="send invoice to Lumen" />
        <button type="submit">add</button>
      </form>

      <nav class="filters">
        <button class="on" data-filter="all">all</button>
        <button data-filter="active">to do</button>
        <button data-filter="done">done</button>
      </nav>
      <div class="progress"><div id="bar"></div></div>

      <ul id="list"></ul>

      <div class="foot">
        <span>press / to jump to the input</span>
        <button id="clear">clear done (0)</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
  <script src="blob.js"></script>
</body>
</html>
